<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Wavely promo stage</title>
<link rel="stylesheet" href="./stage.css">
</head>
<body class="center">
<div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div>
<svg class="waves" viewBox="0 0 1920 220" preserveAspectRatio="none" aria-hidden="true">
  <path d="M0 150 C 240 60, 480 60, 720 130 S 1200 200, 1440 120 S 1800 60, 1920 110"><animate attributeName="d" dur="9s" repeatCount="indefinite" values="M0 150 C 240 60, 480 60, 720 130 S 1200 200, 1440 120 S 1800 60, 1920 110;M0 120 C 240 180, 480 190, 720 110 S 1200 50, 1440 130 S 1800 190, 1920 130;M0 150 C 240 60, 480 60, 720 130 S 1200 200, 1440 120 S 1800 60, 1920 110"/></path>
  <path d="M0 180 C 300 110, 520 120, 820 170 S 1300 210, 1560 160 S 1800 120, 1920 160" opacity="0.6"/>
</svg>

<div class="copy">
  <svg class="logo" viewBox="0 0 64 64"><defs><linearGradient id="lg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#7cc0ee"/><stop offset="1" stop-color="#2F6FB0"/></linearGradient></defs><rect width="64" height="64" rx="18" fill="url(#lg)"/><path d="M12 34c6-14 10-14 14 0s8 14 13 0 8-12 13-4" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round"/></svg>
  <div class="kicker" id="kicker"></div>
  <div class="title" id="title"></div>
  <div class="sub" id="sub"></div>
  <div class="tags" id="tags"></div>
</div>

<div class="cap" id="cap"></div>
<div class="steps" id="steps"><span>Charts</span><span>Player</span><span>Playlists</span><span>Community</span><span>Hebrew + English</span></div>

<div class="phone hide tilt" id="phone"><div class="screen"><iframe id="app" title="Wavely app"></iframe></div></div>
<div class="laptop" id="laptop"><div class="lid"><img id="desk" alt=""></div><div class="base"></div></div>

<script src="./scenes.js"></script>
<script src="./stage.js"></script>
</body>
</html>
